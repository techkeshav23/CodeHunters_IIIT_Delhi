# negation words: after a symptom ("dikkat nahi") or before it ("no chest pain")
negation:
  after: [nahi]
  before: ["no", "not", without, denies, denied, never, bina, na]
  # "na bukhar hai na khansi, bas achanak muh tedha ho gaya": "bas" starts a new statement
  breakers: [aur, and, but, par, lekin, magar, however, kintu, parantu, bas, sirf, only, just, except]
  # "nahi" after these words confirms the symptom: "dard kam nahi ho raha",
  # "bardasht nahi", "bukhar utar nahi raha", "khoon ruk nahi raha".
  # "behosh, uth nahi rahi" (not waking up) confirms too.
  not_after: [bardasht, ruk, rukta, kam, theek, thik, ja, jaa, utar, utarta, band, sudhar, aaram, rahat, chain, so, sakte,
              uth, utha, uthti, uthta, uthte]

# Phrases placing a symptom in the past ("seizure disorder years ago", "pichle saal heart
# attack hua tha"). A red flag in the same phrase is not counted unless the phrase also
# says it is happening now (ab, abhi, now, again, phir se). A year ("in 2019") counts too
# (extract.py). "stroke ke baad wali" (the medicine for after the stroke) is history.
past: [years ago, year ago, months ago, last year, pichle saal, saal pehle, saal purana, history of,
       in the past, used to, had a history, ke baad wali, ke baad wala, ke baad wale, last winter, last summer]
current: [ab, abhi, now, again, phir se, dobara, today, aaj, this episode, is different, alag tarah]

# Long-standing, on-and-off breathlessness or chest discomfort ("sometimes, for 3 months")
# is a same-day problem, not an emergency.
episodic: [sometimes, kabhi kabhi, kabhi kabhar, occasionally, on and off, with activity, do activity,
           when i exercise, exercise ke time, seedhi chadhne, climbing stairs, when i lie down]

# Phrases saying the problem has settled. They only cancel flags marked `soft`;
# chest pain, fainting and the like stay emergencies even if "ab theek hain".
resolved: [ab theek, ab thik, ab sahi, aaram aa gaya, aaram mil gaya, theek ho gaya, theek ho gayi,
           theek ho gaye, bilkul theek, hosh mein hain, hosh mein hai, chal pa rahe, chal pa rahi,
           feels better, feeling better, better now]

# Chest pain that hurts when the spot is pressed or the arm is moved. In a young adult with
# no sweating, breathlessness or dizziness this is chest-wall strain: a same-day check, not
# an ambulance (extract.py). Exertion alone ("gym ke baad") is NOT on this list.
chest_wall: [dabane pe, dabane par, dabane se, dabaane pe, dabaane par, press karne, on pressing, when i press,
             when pressed, tender to touch, haath upar karne, haath upar karne pe, haath uthane, haath ghumane,
             haath hilane, moving my arm, move my arm, arm movement]

# Someone other than the patient ("padosi wale uncle", "TV pe ek aadmi"). A red flag in a
# sentence about such a person, told in the past or from the news, is not the patient's when
# the message is about a family member elsewhere (extract.py).
third_party: [padosi, padosan, padosiyon, neighbour, neighbor, ek aadmi, ek aurat, ek ladka, ek ladki,
              someone, somebody, a man, a woman, a guy, colleague, celebrity, actor]
report: [tv, news, akhbaar, akhbar, newspaper, article, youtube, film, movie, serial, documentary]

modifiers:
  # checked within 3 words of the symptom, same sentence
  severe: [bahut tez, bahut zyada, bahut dard, tez dard, tez bukhar, severe, unbearable, asahniya, "bardasht nahi", extreme, worst, intense, "very bad", "very severe", sar phat]
  sudden: [achanak, ekdam, "ek dam se", "ekdum se", "all of a sudden", "abhi abhi"]
  mild: [halka, halki, halke, thoda, thodi, "thoda sa", mild, slight, "a bit", "little bit"]

# Red flags. `patterns` always fire. `conditional` patterns fire only with
# one of `requires`: severe, sudden, infant (under 3 months), baby (under 1 year), child,
# older_adult, pregnant, fever, diabetic, heat, bp_danger, postpartum (delivery in the last
# weeks), palpitations, or pair.
# `pair`: the block has a `group`, and fires when a different group of the same red flag is
# also in the message (arm weakness + slurred speech; chest burning + sweating). `pair_with`
# limits which groups count as a partner (both sides must accept each other).
red_flags:
  - id: breathing_difficulty
    label: Breathing difficulty
    label_hinglish: Saans lene mein dikkat
    label_hi: सांस लेने में दिक्कत
    patterns:
      - saans nahi aa
      - saans nahi le
      - saans nahi ho
      - saans dikkat
      - dikkat saans
      - saans phool
      - saans fool
      - saans ruk
      - saans atak
      - saans chadh
      - saans tez chal
      - dam ghut
      - dum ghut
      - hont neele
      - "can't breathe"
      - cannot breathe
      - unable to breathe
      - not able to breathe
      - short of breath
      - shortness of breath
      - breathless
      - breathlessness
      - gasping
      - not breathing
      - choking
      - lips blue
      - saans bhari
      - saans bhaari
      - pasliyan chal
      - pasli chal
      - pasliyan andar
      - chest indrawing
      - neela pad
      - neeli pad
      - neele pad
      - turning blue
      - khana atak
      - gale atak
      - gala atak
      - kuch atak gaya
      - sikka atak
      - saans tez
      - pump se bhi aaram nahi
      - inhaler se aaram nahi
      - inhaler not helping
      # chest pulling in, too breathless to finish a sentence
      - seena dhans
      - pasli dhans
      - pasliyan dhans
      - chest pulling in
      - chest sucking in
      - retractions
      - sentence nahi bol
      - "can't finish a sentence"
      - "can't complete a sentence"
      - cannot finish a sentence
      - "can't speak in full sentences"
      - सांस नहीं आ रही
      - सांस लेने में दिक्कत
      - सांस फूल रही
      - दम घुट रहा
    conditional:
      - patterns: [seeti awaaz, seeti jaisi, wheezing, wheeze]
        requires: [child, infant, severe]
      # gone silent (no voice, silent cry) after choking or a swallowed object; a young baby always
      - group: voice
        patterns: [awaaz nahi nikal, rone par awaaz nahi, rone pe awaaz nahi, "can't cry", no sound, silent cry]
        requires: [infant, pair]
      - group: object
        patterns: [sikka, coin, nigal, swallowed, kuch atak, choked on, choke on]
        requires: [pair]
        pair_with: [voice]
  - id: chest_pain
    label: Chest pain or pressure
    label_hinglish: Seene mein dard ya dabav
    label_hi: सीने में दर्द या दबाव
    patterns:
      - seena dard
      - dard seena
      - seena dabav
      - seena dabaav
      - seena bhari
      - seena bhaaripan
      - chest tightness
      - chest pressure
      - chest discomfort
      - seena bechaini
      - seena ghabrahat
      - seena pressure
      - pressure seena
      - seena tight
      - tight seena
      - baayein haath dard
      - baaye haath dard
      - left arm dard
      - haath tak dard
      - jabde dard
      - jaw dard
      - heart attack
      - dil dard
      - dil ka daura
      - सीने में दर्द
      - छाती में दर्द
    conditional:
      # how heart attacks are often described: "seene mein jalan" (burning, read as acidity),
      # jaw or shoulder pain, with sweating. Any one alone is not enough.
      - group: burn
        patterns: [seena jalan, jalan seena, chest burning, burning chest, burning in chest]
        requires: [pair]
      - group: sweat
        patterns: [pasina, sweating, sweaty]
        requires: [pair]
        pair_with: [burn]
      - group: cold_sweat
        patterns: [thanda pasina, cold sweat, cold sweats, pasina pasina, bahut pasina, clammy, drenched in sweat]
        requires: [pair]
        pair_with: [burn, radiate]
      - group: radiate
        patterns: [jabda, kandha dard, dard kandha, kandha dukh]
        requires: [pair]
        pair_with: [burn, cold_sweat]
  - id: stroke_signs
    label: Stroke warning signs (face, arm, speech)
    label_hinglish: Lakwe ke lakshan (chehra, haath, bolna)
    label_hi: लकवे के लक्षण (चेहरा, हाथ, बोलना)
    exclude_if_before: [heat, hit, sun]   # "heat stroke" / "हीट स्ट्रोक" is not a brain stroke
    patterns:
      - munh tedha
      - muh tedha
      - chehra tedha
      - face drooping
      - face droop
      - mouth drooping
      - mouth droop
      - muh ek taraf
      - munh ek taraf
      - chehra ek taraf
      - muh latak
      - munh latak
      - chehra latak
      - hont latak
      - ek taraf latak
      - ek taraf ka hissa
      - hissa kaam karna band
      - hissa kaam nahi
      - ek taraf kaam nahi
      - ek taraf kamzori
      - ek side kamzori
      - ek taraf sunn
      - ek side sunn
      - aadha sharir
      - one side weak
      - weakness on one side
      - lakwa
      - zubaan ladkhada
      - jeebh ladkhada
      - boli ladkhada
      - awaaz ladkhada
      - bolne ladkhada
      - slurred speech
      - speech slurred
      - slurring
      - stroke
      - मुंह टेढ़ा
      - लकवा
    conditional:
      # face, arm, speech, balance: one sign needs a sudden start or an older patient,
      # two different signs together are a stroke at any age
      - group: speech
        patterns: [bolne dikkat, bol nahi pa, speech problem, "can't speak", ladkhada, bolna band,
                   baat atak, atak atak bol, atak atak ke bol, atak atak ke bolne, atak atak bolne, atak ke bolne,
                   shabd nahi nikal, shabd nahi aa, alfaaz nahi,
                   "can't find words", cannot find words, "can't get words out", trouble finding words,
                   word finding, trouble speaking, difficulty speaking, words jumbled, jumbled words, garbled]
        requires: [sudden, older_adult, pair]
      - group: limb
        patterns: [haath nahi uth, haath uth nahi, baazu nahi uth, pair nahi uth, pair uth nahi, cannot lift,
                   "can't lift", "can not lift", unable to lift, haath sunn, pair sunn, haath pair sunn,
                   haath aur pair sunn, arm numb, leg numb, numb arm, numb leg, arm heavy, leg heavy,
                   haath kaam nahi, pair kaam nahi, haath jaan nahi, pair jaan nahi, haath taakat nahi,
                   "can't move arm", "can't move leg", "can't move his arm",
                   "can't move her arm", "can't move his leg", "can't move her leg"]
        requires: [sudden, older_adult, pair]
      - group: face
        patterns: [laar gir, laar tapak, lar gir, muh se laar, munh se laar, drooling, drool]
        requires: [sudden, pair]
      # sudden spinning plus falling or leaning to one side: a stroke in the back of the brain
      - group: lateral
        patterns: [ek taraf gir, ek side gir, ek taraf jhuk, ek side jhuk, falling to one side, falls to one side,
                   leaning to one side, leans to one side, tilting to one side, veering to one side]
        requires: [sudden, pair]
      - group: balance
        patterns: [balance nahi, balance kho, lose balance, losing balance, lost balance, "can't walk straight",
                   seedha chal nahi, seedha khada nahi]
        requires: [sudden, pair]
        pair_with: [speech, limb, face, lateral]
      - group: vertigo
        patterns: [chakkar]
        requires: [pair]
        pair_with: [lateral]
  - id: unconscious
    label: Unconscious or not responding
