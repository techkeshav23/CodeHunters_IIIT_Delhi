# CareCompass lexicon (English, Hindi, Hinglish).
#
# Every word below is passed through app/nlp/normalize.py (Devanagari is
# transliterated, spellings are reduced to a phonetic key), so write words the
# natural way. Pattern words are matched in order with up to 2 extra words in
# between, never across a sentence boundary. Words of 5+ letters also match
# small typos.
#
# Align red flags with the organisers' care taxonomy when it arrives and have
# the clinical mentors review this file.

# canonical word: [other spellings / languages that mean the same thing]
aliases:
  saans: [saas, swas, shwas, saanse, saanso, saanson, saansein, breath, breathe, breathing, briding, brithing]
  dikkat: [dikkt, takleef, taklif, pareshani, problem, difficulty, dificulty, trouble, problam, prablam]
  dard: [dardh, drd, pain, pains, painful, ache, aching, hurts, hurting, peeda, dukh, pen, pein]
  seena: [seene, sina, seeney, chhati, chati, chaati, chest]
  sar: [sir, head, matha]
  pet: [stomach, abdomen, abdominal, tummy, belly]
  khoon: [khun, khon, khoon, blood, bleeding, bleed]
  ulti: [ulty, ultiyan, ultiya, vomit, vomits, vomiting, vomitting]
  behosh: [behos, beyhosh, behoshi, unconscious, unresponsive]
  bukhar: [bukar, bkhar, bukhaar, fever, feverish, jwar, jvar]
  khansi: [khasi, kansi, khaasi, cough, coughing, coughs]
  chakkar: [chakar, dizzy, dizziness, giddy, giddiness, vertigo]
  mirgi: [epilepsy]
  lakwa: [laqwa, lakva, paralysis, paralysed, paralyzed, falij]
  zeher: [jahar, zahar, jehar, poison, poisoning, poisonous]
  pregnant: [pregnent, pregnancy, garbhvati, garbhavati]
  bachcha: [bacha, bachha, baccha, bachche, bache, bacche, bachchi, bachi, baby, bebi, kid, child, shishu]
  navjaat: [navjat, newborn, nawjat]
  saanp: [sanp, saamp, samp, saap, sap, snake]
  bichhu: [bichu, scorpion]
  kaat: [kata, kaata, kati, kaati, kate, bite, bitten]
  sujan: [sooj, suj, sooja, soojan, sujna, swelling, swollen, swell]
  chehra: [chehre, face, fes, phes]
  hont: [honth, hoth, lips, lip]
  jeebh: [jibh, tongue]
  peshab: [pishab, pesab, urine]
  kamzori: [kamjori, kamzor, weakness, weak]
  ghutna: [ghutne, ghutno, ghutnon, knee, knees]
  nahi: [nahin, nai, nhi, ni, nahee, nahii]
  # WhatsApp-style short forms
  raha: [rha]
  rahi: [rhi]
  rahe: [rhe]
  bahut: [bht, bhot, bohot, bahot, bahoot, bhut]
  tedha: [teda, ted, tedhi, tedi, terha, tirchha]
  aankh: [aankhein, aankhen, ankhe, ankhen, eyes, eye]
  baayein: [baayen, baye, bayen, baain, left]
  baat: [baatein, baaten, baaton]
  # English words as speech-to-text writes them in Devanagari (सुसाइड, हैवी, प्रेशर)
  suicide: [susaid, suisaid, susaaid]
  heavy: [haivi, hevi]
  pressure: [preshar, presar, preshr]
  confused: [kanfyuz, kanfyuj, confuse, confuzed, kanfyuzd]
  stroke: [strok, istrok]
  side: [saaid, said]
  temperature: [temprechar, tempreechar, temparechar, tempchar]
  throat: [throt, throt]
  mild: [maild, maaild]
  cough_word: [kaf, kof, coff]
  zyada: [jyada, jyaada, zyaada, jada]
  tez: [tej, high]
  achanak: [achaanak, suddenly, sudden]
  pada: [pda, pad, pade, padi, pde]
  dikha: [dikhani, dikhana, dikhane, dikhao, dikhaana, dikhaani, show]
  dekh: [dekhna, dekhni, dekhne, dekho]
  dawai: [dawa, dava, davai, medicine, medicines, tablet, tablets, pills]

# negation words: after a symptom ("dikkat nahi") or before it ("no chest pain")
negation:
  after: [nahi]
  before: ["no", "not", without, denies, denied, never, bina, na]
  breakers: [aur, and, but, par, lekin, magar, however, kintu, parantu]
  # "nahi" after these words confirms the symptom: "dard kam nahi ho raha",
  # "bardasht nahi", "bukhar utar nahi raha", "khoon ruk nahi raha".
  not_after: [bardasht, ruk, rukta, kam, theek, thik, ja, jaa, utar, utarta, band, sudhar, aaram, rahat, chain, so, sakte]

# Phrases placing a symptom in the past ("seizure disorder years ago", "pichle saal heart
# attack hua tha"). A red flag in the same phrase is not counted unless the phrase also
# says it is happening now (ab, abhi, now, again, phir se).
past: [years ago, year ago, months ago, last year, pichle saal, saal pehle, saal purana, history of,
       in the past, used to, had a history]
current: [ab, abhi, now, again, phir se, dobara, today, aaj, this episode, is different, alag tarah]

# Long-standing, on-and-off breathlessness or chest discomfort ("sometimes, for 3 months")
# is a same-day problem, not an emergency.
episodic: [sometimes, kabhi kabhi, kabhi kabhar, occasionally, on and off, with activity, do activity,
           when i exercise, exercise ke time, seedhi chadhne, climbing stairs, when i lie down]

# Phrases saying the problem has settled. They only cancel flags marked `soft`;
# chest pain, fainting and the like stay emergencies even if "ab theek hain".
resolved: [ab theek, ab thik, ab sahi, aaram aa gaya, aaram mil gaya, theek ho gaya, theek ho gayi,
           theek ho gaye, bilkul theek, hosh mein hain, hosh mein hai, chal pa rahe, chal pa rahi,
           feels better, feeling better, better now]

modifiers:
  # checked within 3 words of the symptom, same sentence
  severe: [bahut tez, bahut zyada, bahut dard, tez dard, tez bukhar, severe, unbearable, asahniya, "bardasht nahi", extreme, worst, intense, "very bad", "very severe", sar phat]
  sudden: [achanak, ekdam, "ek dam se", "all of a sudden", "abhi abhi"]
  mild: [halka, halki, halke, thoda, thodi, "thoda sa", mild, slight, "a bit", "little bit"]

