server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API, on the same origin when the web app is built with VITE_API_BASE=same-origin
  # (docker-compose.server.yml). Docker's DNS resolves "api" at request time, so this
  # container still starts when there is no api service next to it.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api http://api:8000;
  location ~ ^/(v1/|health$|docs|openapi\.json) {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
  }

  # Single-page app: always fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for fingerprinted assets (fonts, js, css).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The service worker must always be fresh so updates reach installed apps.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;
}
