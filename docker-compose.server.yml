# Production on a shared server: both containers listen on 127.0.0.1 only; the server's
# own reverse proxy (CloudPanel) terminates HTTPS for the subdomain and forwards to the web
# container, which serves the app and passes /v1, /health and /docs to the API.
#
#   docker compose -f docker-compose.server.yml up -d --build
#   docker compose -f docker-compose.server.yml down        # remove everything
name: carecompass

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - CC_FOLLOWUP_POLICY=minimal
      - CC_TOP_K=3
    volumes:
      - ./data/provided:/srv/data/provided:ro
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: same-origin
    ports:
      - "127.0.0.1:8001:80"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
